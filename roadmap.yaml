    title: 作出范围提案
    action: 选择最多两条首版 exact edge、必要 facts、六类候选根因、依赖选择；核查名称/再分发但不注册或发布。
    acceptance: 支持提案说明可测/不可测；与普通 env sync 的区别成立；若不足则给 NO-GO/PIVOT 而非造代码。
