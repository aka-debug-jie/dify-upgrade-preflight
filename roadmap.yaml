  - id: P00.T1
    title: 核查工作区与权限
    action: 检查已有目录、Git 状态、Python/Compose 可用性与是否有独立实验环境；不连接 daemon、不安装系统软件。
    acceptance: ENVIRONMENT 明确已有/缺失/未验证；没有任何生产读写和全局设置变更。
    status: done
    artifacts:
    - artifacts/P00/20260913T075059Z/ENVIRONMENT.md
