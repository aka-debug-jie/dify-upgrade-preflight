  goal: 不写业务代码，确认两类以上机器可检测的真实痛点，提出两条可固定的候选升级边及最小环境方案。
  acceptance:
  - 实际已获得的来源和未获得的来源分开；关键来源无法固定则不能完成本阶段。
  - 候选路径/事实足以支持一个小闭环，且依赖/名称/许可风险被记录。
  - 你审核范围提案后才解锁 P01；没有批准不得先写业务实现。
