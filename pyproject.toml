[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dify-upgrade-preflight"
version = "0.1.0b0"
description = "Offline, read-only, evidence-driven Dify upgrade preflight tool"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["build==1.6.1", "pytest==9.1.1"]

[project.scripts]
dify-preflight = "dify_preflight.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dify_preflight = ["data/*.json", "data/*.yaml"]
